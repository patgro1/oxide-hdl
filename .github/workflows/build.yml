name: Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.vscode_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vscode_target: win32-x64

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            vscode_target: win32-arm64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
            use_cross: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            vscode_target: alpine-x64
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            vscode_target: alpine-arm64
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            vscode_target: darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            vscode_target: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/oxide-hdl oxide-hdl

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/oxide-hdl.exe oxide-hdl.exe
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.vscode_target }}
          path: oxide-hdl*
          if-no-files-found: error
          retention-days: 7
