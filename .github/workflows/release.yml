name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.vscode_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vscode_target: win32-x64

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            vscode_target: win32-arm64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
            use_cross: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            vscode_target: alpine-x64
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            vscode_target: alpine-arm64
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            vscode_target: darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            vscode_target: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/oxide-hdl oxide-hdl

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/oxide-hdl.exe oxide-hdl.exe
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.vscode_target }}
          path: oxide-hdl*
          if-no-files-found: error

  publish:
    name: Package and publish VSIXs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm install

      - name: Compile extension
        working-directory: editors/vscode
        run: npm run compile

      - name: Set version from tag
        working-directory: editors/vscode
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$VERSION" --no-git-tag-version

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package platform-specific VSIXs
        working-directory: editors/vscode
        run: |
          for vscode_target in win32-x64 win32-arm64 linux-x64 linux-arm64 alpine-x64 alpine-arm64 darwin-x64 darwin-arm64; do
            mkdir -p bin
            if [[ "$vscode_target" == win32* ]]; then
              cp "../../artifacts/$vscode_target/oxide-hdl.exe" bin/oxide-hdl.exe
            else
              cp "../../artifacts/$vscode_target/oxide-hdl" bin/oxide-hdl
              chmod +x bin/oxide-hdl
            fi
            npx vsce package --target "$vscode_target" --out "oxide-hdl-${vscode_target}.vsix"
            rm -f bin/oxide-hdl bin/oxide-hdl.exe
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/*.vsix
          generate_release_notes: true

      # Marketplace publish — uncomment once VSIXs are tested locally.
      # Requires a VSCE_PAT secret (Personal Access Token from marketplace.visualstudio.com).
      #
      # - name: Publish to VS Marketplace
      #   working-directory: editors/vscode
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      #   run: npx vsce publish --pat "$VSCE_PAT" --packagePath oxide-hdl-*.vsix
