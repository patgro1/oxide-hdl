[package]
name = "oxide-hdl"
version = "0.5.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
clap = { version = "4.0", features = ["derive"] }
globset = "0.4"
include_dir = "0.7.4"
lazy_static = "1.4"
regex = "1"
ropey = "1.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9.8"
tower-lsp = "0.20"
tree-sitter = "0.25.10"
walkdir = "2.5.0"

[build-dependencies]
cc = "1.0"
